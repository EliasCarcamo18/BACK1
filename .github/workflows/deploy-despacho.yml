name: Deploy Backend Despacho to AWS

on:
  push:
    branches: [ deploy ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v3

    - name: Iniciar Sesión en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir y Publicar Imagen de Despacho
      run: |
        cd ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-despacho:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-despacho:latest

    - name: Desplegar en AWS EC2 vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_EC2_IP }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          cd /home/ec2-user/back-Despachos_SpringBoot || mkdir -p /home/ec2-user/back-Despachos_SpringBoot
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/back-despacho:latest
          sudo docker stop contenedor-back-despacho || true
          sudo docker rm contenedor-back-despacho || true
          sudo docker run -d -p 5000:5000 --name contenedor-back-despacho --restart always ${{ secrets.DOCKERHUB_USERNAME }}/back-despacho:latest